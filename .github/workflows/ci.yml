name: CI

on:
  push:
    branches: [main, "atlas/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: node --experimental-strip-types --test --test-reporter=junit test/*.test.mjs > junit.xml
      - name: Upload Benchmark inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: junit.xml
          if-no-files-found: ignore
