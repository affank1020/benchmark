name: CI

on:
  push:
    branches: [main, "atlas/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Node and Rust release version alignment (read-only)
        run: node scripts/check-rust-release-readiness.mjs
      # One test execution produces both of Benchmark's supported input formats.
      # Restrict the LCOV file to the reporter implementation, not test files.
      - name: Run unit tests with coverage
        id: tests
        run: |
          node --experimental-strip-types --experimental-test-coverage \
            --test-coverage-include='src/**/*.mjs' \
            --test-coverage-include='src/**/*.ts' \
            --test --test-reporter=junit --test-reporter-destination=junit.xml \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            test/*.test.mjs
      - name: Smoke-test actual Node.js JUnit and LCOV output
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          # Node's V8 LCOV omits files not executed at all; fail closed.
          # On a mismatch this deletes lcov.info before the always() upload.
          node test/verify-lcov-inventory.mjs lcov.info
          test -s junit.xml
          node --experimental-strip-types src/cli.mjs --tests junit.xml --coverage lcov.info --ci failure --json benchmark-smoke.json > benchmark-smoke.md
          node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("benchmark-smoke.json", "utf8")); if (!report.tests || report.tests.total < 1) { console.error("Benchmark could not parse its CI JUnit artifact"); process.exit(1); } if (process.env.TEST_OUTCOME === "success" && (!report.coverage || report.coverage.lines.found < 1 || report.coverage.functions.found < 1)) { console.error("Successful CI did not generate parseable source LCOV coverage"); process.exit(1); }'
      - name: Upload Benchmark inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: |
            junit.xml
            lcov.info
          if-no-files-found: ignore

  # Rust is additive during migration: the deployed Node CLI and its coverage
  # inventory must continue to pass independently until full parity is proven.
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Rust formatting
        run: cargo +1.85.1 fmt --all -- --check
      - name: Lint Rust code
        run: cargo +1.85.1 clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo +1.85.1 test --locked --all-targets
      - name: Build CLI and verify Node/Rust report parity
        run: |
          cargo +1.85.1 build --locked --bin benchmark
          node test/rust-cli-parity.mjs
      - name: Release-build and smoke-test the pinned publisher invocation
        run: |
          cargo +1.85.1 build --locked --release --manifest-path Cargo.toml --bin benchmark
          target/release/benchmark \
            --coverage fixtures/absent.info \
            --tests test/fixtures/node22-junit.xml \
            --ci failure --output rust-release-smoke.md
          node --experimental-strip-types src/cli.mjs \
            --coverage fixtures/absent.info \
            --tests test/fixtures/node22-junit.xml \
            --ci failure --output node-release-smoke.md
          cmp rust-release-smoke.md node-release-smoke.md
