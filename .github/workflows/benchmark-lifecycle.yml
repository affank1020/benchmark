# Trusted API-only pull_request_target status workflow. Never checkout PR code.
name: Benchmark PR Lifecycle

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write

# Coordinate with the workflow_run publisher across workflows for the same source.
concurrency:
  group: benchmark-report-${{ github.repository_id }}-${{ github.event.pull_request.head.repo.id }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  waiting:
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh waiting comment for the current PR head
        uses: actions/github-script@v7
        with:
          script: |
            // pull_request_target always executes this trusted default-branch script.
            // Do not checkout or execute PR head code with a comment-write token.
            const { owner, repo } = context.repo;
            const incoming = context.payload.pull_request;
            const issue_number = context.payload.number;
            if (!Number.isSafeInteger(issue_number) || issue_number < 1 ||
                incoming?.number !== issue_number ||
                !Number.isSafeInteger(incoming.head?.repo?.id) ||
                typeof incoming.head?.sha !== 'string' ||
                typeof incoming.head?.ref !== 'string') {
              core.warning('PR event has no trustworthy source identity.');
              return;
            }
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (current.state !== 'open' || current.base?.repo?.full_name !== owner + '/' + repo ||
                current.base?.repo?.id !== context.payload.repository?.id ||
                current.head?.repo?.id !== incoming.head.repo.id ||
                current.head?.sha !== incoming.head.sha ||
                current.head?.ref !== incoming.head.ref) {
              core.notice('PR changed or was closed before the waiting status could be posted.');
              return;
            }
            const marker = '<!-- benchmark-pr-quality-report -->';
            const metadata = '<!-- benchmark-head-sha:' + current.head.sha + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' && comment.body.includes(marker)
            );
            // Late webhook delivery cannot downgrade a processing or completed report.
            if (previous?.body?.includes(metadata)) {
              core.notice('A status for this exact PR head already exists.');
              return;
            }
            const body = [
              marker, metadata, '<!-- benchmark-state:waiting -->',
              '## Benchmark · Preparing PR Quality Report',
              '⏳ **Waiting for CI**',
              'Benchmark will update this comment after CI completes.',
              '[View PR checks](https://github.com/' + owner + '/' + repo + '/pull/' + issue_number + '/checks)'
            ].join('\n\n');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
