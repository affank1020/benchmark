# Read-only build/verification of unreleased native Rust candidates.
# These PR CI artifacts are NEVER consumed by a privileged publisher.
# The existing annotated-tag release flow remains independent.
name: Rust binary candidates

on:
  pull_request:
  push:
    branches: [main, "atlas/**"]

permissions:
  contents: read

jobs:
  native-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Verify runner platform and architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'if (process.platform + "-" + process.arch !== process.env.EXPECTED_TARGET) process.exit(1)'
      - name: Test Rust on native target
        run: cargo +1.85.1 test --locked --all-targets
      - name: Build native executable
        run: cargo +1.85.1 build --locked --release --bin benchmark
      - name: Smoke-test native executable
        shell: bash
        run: |
          set -euo pipefail
          target/release/benchmark \
            --coverage does-not-exist.info \
            --tests test/fixtures/node22-junit.xml \
            --ci failure --output "$RUNNER_TEMP/rust-native-smoke.md"
          grep -F -q '<!-- benchmark-pr-quality-report -->' "$RUNNER_TEMP/rust-native-smoke.md"
          grep -F -q '**CI:** ❌ Failed (failure)' "$RUNNER_TEMP/rust-native-smoke.md"
          grep -F -q 'Coverage artifact missing or invalid' "$RUNNER_TEMP/rust-native-smoke.md"
      # Regression for review finding #23: target/ is ignored by Git, so a
      # previously compiled executable must NEVER be the candidate payload.
      - name: Prove candidate packaging ignores a stale target binary
        shell: bash
        run: printf 'deliberately stale previous build' > target/release/benchmark
      - name: Package verified commit as an unreleased candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-rust-candidate.mjs \
            --out-dir "$RUNNER_TEMP/rust-candidate" --commit "$GITHUB_SHA"
          node scripts/verify-rust-candidate.mjs \
            --out-dir "$RUNNER_TEMP/rust-candidate" --commit "$GITHUB_SHA"
      - name: Upload untrusted CI build for review (not an official release)
        uses: actions/upload-artifact@v4
        with:
          name: rust-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/rust-candidate/
          if-no-files-found: error
          retention-days: 7
