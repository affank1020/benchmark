# Copy to .github/workflows/benchmark-report.yml in the consuming repository.
# Replace [CI] with the exact name of your pull_request CI workflow.
# After a Benchmark release, PIN @main to an immutable released commit SHA.
name: Benchmark PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# The workflow that runs on PR code should use a READ-ONLY token.
# Only this trusted post-CI workflow needs issues:write.
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    uses: affank1020/benchmark/.github/workflows/reusable-report.yml@main
    with:
      artifact_name: benchmark-ci
