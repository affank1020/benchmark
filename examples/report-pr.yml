# Copy this file to .github/workflows/benchmark-report.yml in a consuming repo.
# Edit 'workflows: [CI]' to the exact name of the existing PR CI workflow.
name: Benchmark PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current PR safely
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            let prs = run.pull_requests || [];
            if (!prs.length) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha, per_page: 100
              });
              prs = associated.data;
            }
            for (const candidate of prs) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: candidate.number });
              if (pr.state === 'open' && pr.head.sha === run.head_sha) {
                core.setOutput('number', String(pr.number));
                return;
              }
            }
            core.warning('No open PR matching this CI run head SHA; not publishing a comment.');
      - name: Checkout trusted Benchmark implementation
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          repository: affank1020/benchmark
          ref: main # Pin a released commit SHA once available.
          path: benchmark
          persist-credentials: false
      - name: Download existing CI report artifact
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: benchmark-ci
          path: artifacts
      - name: Generate quality report (even after CI failure)
        if: steps.pr.outputs.number != ''
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node --version
          node --experimental-strip-types benchmark/src/cli.mjs \
            --coverage artifacts/lcov.info \
            --tests artifacts/junit.xml \
            --ci "$CI_CONCLUSION" \
            --output benchmark-report.md
      - name: Update one PR comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { readFileSync } = require('fs');
            const body = readFileSync('benchmark-report.md', 'utf8');
            if (body.length > 20000) throw new Error('Benchmark output too large');
            const marker = '<!-- benchmark-pr-quality-report -->';
            if (!body.includes(marker)) throw new Error('Missing report marker');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid PR');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
