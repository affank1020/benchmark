# Copy this file to .github/workflows/benchmark-report.yml in a consuming repo.
# Edit 'workflows: [CI]' to the exact name of the existing PR CI workflow.
name: Benchmark PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

# Serialize per source repository and branch, including forks, regardless of
# whether workflow_run.pull_requests is populated. GH can replace pending runs;
# publish-time checks prevent outdated results from being posted.
concurrency:
  group: benchmark-report-${{ github.repository_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  queue: max
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted Benchmark implementation
        uses: actions/checkout@v4
        with:
          repository: affank1020/benchmark
          ref: 81b6602198c38a74d6b539a484ff25b86c8e0cc8 # Reviewed Benchmark PR #4 baseline-comparison release
          path: benchmark
          persist-credentials: false
      - name: Resolve current PR safely
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const pr = await policy.resolveRunPr(
              context.payload.workflow_run, github, context.repo
            );
            if (pr) {
              core.setOutput('number', String(pr.number));
            } else {
              core.warning('No uniquely verified open PR for this CI run; not publishing.');
            }
      - name: Publish processing status on the same PR comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid PR number');
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (current.base?.repo?.full_name !== owner + '/' + repo ||
                !policy.matchesRunToPr(run, current)) {
              core.warning('PR is closed, retargeted, or changed; status not published.');
              return;
            }
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
            if (liveRun.id !== run.id || liveRun.run_attempt !== run.run_attempt ||
                liveRun.status !== 'completed' || liveRun.head_sha !== run.head_sha) {
              core.warning('Source CI was superseded or restarted; status not published.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha,
              event: 'pull_request', per_page: 100
            });
            if (!policy.isLatestCompletedRun(run, runs.filter(r => r.status === 'completed')) ||
                runs.some(r => r.workflow_id === run.workflow_id && r.head_sha === run.head_sha &&
                  r.event === 'pull_request' &&
                  (r.run_number > run.run_number ||
                    (r.run_number === run.run_number && r.run_attempt > run.run_attempt)))) {
              core.warning('A newer CI run exists; status not published.');
              return;
            }
            const marker = '<!-- benchmark-pr-quality-report -->';
            const metadata = '<!-- benchmark-head-sha:' + current.head.sha + ' -->';
            const runMarker = '<!-- benchmark-ci-run:' + run.id + ':' + run.run_attempt + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = policy.findOwnedReportComment(comments, marker);
            const body = [marker, metadata, runMarker, '<!-- benchmark-state:processing -->',
              '## Benchmark · Preparing PR Quality Report',
              '🔄 **Processing CI results**',
              'CI has finished. Benchmark is retrieving test and coverage results and preparing the report.',
              '[View CI run](https://github.com/' + owner + '/' + repo + '/actions/runs/' + run.id + ')'
            ].join('\n\n');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Set up supported Node.js runtime
        if: steps.pr.outputs.number != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve bounded CI artifacts by exact name
        if: steps.pr.outputs.number != ''
        id: artifact
        uses: actions/github-script@v7
        env:
          BENCHMARK_TESTS_ARTIFACT_NAME: benchmark-ci
          BENCHMARK_COVERAGE_ARTIFACT_NAME: benchmark-ci
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.payload.workflow_run.id;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, per_page: 100
            });
            // Separate CI jobs may upload JUnit and LCOV independently. Resolve
            // exact unique artifact IDs before download; do not select by name later.
            for (const [kind, name] of [
              ['tests', process.env.BENCHMARK_TESTS_ARTIFACT_NAME],
              ['coverage', process.env.BENCHMARK_COVERAGE_ARTIFACT_NAME]
            ]) {
              if (typeof name !== 'string' || !name || name.length > 128) {
                throw new Error('Invalid ' + kind + ' artifact name');
              }
              const matching = artifacts.filter(a => a.name === name);
              if (matching.length !== 1) {
                core.warning('No unique CI ' + kind + ' artifact named ' + name);
                continue;
              }
              const source = matching[0];
              if (!Number.isSafeInteger(source.id) || source.id <= 0 ||
                  source.expired ||
                  !Number.isSafeInteger(source.size_in_bytes) ||
                  source.size_in_bytes <= 0 ||
                  source.size_in_bytes > 25 * 1024 * 1024) {
                core.warning('CI ' + kind + ' artifact unavailable or larger than 25 MiB');
                continue;
              }
              core.setOutput(kind + '_id', String(source.id));
            }
      - name: Download exact CI test artifact
        if: steps.artifact.outputs.tests_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-ids: ${{ steps.artifact.outputs.tests_id }}
          merge-multiple: true
          path: artifacts/tests
      - name: Download exact CI coverage artifact
        if: steps.artifact.outputs.coverage_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-ids: ${{ steps.artifact.outputs.coverage_id }}
          merge-multiple: true
          path: artifacts/coverage
      - name: Find exact base-branch coverage artifact
        id: baseline
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
          BENCHMARK_ARTIFACT_NAME: benchmark-ci
        with:
          script: |
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error('Invalid source PR number');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (!policy.matchesRunToPr(run, pr)) {
              core.warning('PR changed before baseline lookup; no comparison.');
              return;
            }
            const base = pr.base;
            if (!base?.sha || !base?.ref || base.repo?.id !== context.payload.repository?.id) {
              core.warning('Unverified base repository; no comparison.');
              return;
            }
            // Never substitute the latest branch run for a different base SHA.
            // Only a completed push of the very same CI workflow to the exact
            // currently targeted base commit can serve as a baseline.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id,
              branch: base.ref, head_sha: base.sha, event: 'push',
              status: 'completed', per_page: 100
            });
            const matches = runs.filter(candidate =>
              candidate.repository?.id === base.repo.id &&
              candidate.workflow_id === run.workflow_id &&
              candidate.head_sha === base.sha &&
              candidate.head_branch === base.ref &&
              candidate.event === 'push' &&
              candidate.status === 'completed' &&
              Number.isSafeInteger(candidate.run_number) &&
              Number.isSafeInteger(candidate.run_attempt)
            ).sort((a, b) => b.run_number - a.run_number ||
              b.run_attempt - a.run_attempt);
            const latest = matches[0];
            if (!latest || latest.conclusion !== 'success') {
              core.notice('No successful CI push at the exact PR base SHA; omitting coverage comparison.');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: latest.id, per_page: 100
            });
            // Reruns may leave multiple artifacts with the same name.
            // Fail closed on ambiguity; never validate one and download another.
            const named = artifacts.filter(artifact =>
              artifact.name === process.env.BENCHMARK_ARTIFACT_NAME
            );
            if (named.length !== 1) {
              core.notice('No unique base CI artifact for this name; omitting coverage comparison.');
              return;
            }
            const source = named[0];
            if (!Number.isSafeInteger(source.id) || source.id <= 0 ||
                source.expired ||
                !Number.isSafeInteger(source.size_in_bytes) ||
                source.size_in_bytes <= 0 ||
                source.size_in_bytes > 25 * 1024 * 1024) {
              core.notice('Exact base CI has no usable bounded artifact; omitting coverage comparison.');
              return;
            }
            core.setOutput('present', 'true');
            core.setOutput('run_id', String(latest.id));
            core.setOutput('run_attempt', String(latest.run_attempt));
            core.setOutput('artifact_id', String(source.id));
            core.setOutput('base_sha', base.sha);
            core.setOutput('base_ref', base.ref);
      - name: Download exact base CI artifact
        if: steps.baseline.outputs.present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          # ID-based downloads otherwise extract to baseline/<artifact-name>/.
          # Only one validated artifact ID is supplied, so merging is safe.
          merge-multiple: true
          path: baseline
      - name: Generate quality report (even after CI failure)
        if: steps.pr.outputs.number != ''
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node --version
          baseline_args=()
          if [ -f baseline/lcov.info ]; then
            baseline_args=(--baseline-coverage baseline/lcov.info)
          fi
          node --experimental-strip-types benchmark/src/cli.mjs \
            --coverage artifacts/coverage/lcov.info \
            --tests artifacts/tests/junit.xml \
            --ci "$CI_CONCLUSION" \
            "${baseline_args[@]}" \
            --output benchmark-report.md
      - name: Update one PR comment if still current
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
          BENCHMARK_BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
          BENCHMARK_BASE_REF: ${{ steps.baseline.outputs.base_ref }}
          BENCHMARK_BASE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
          BENCHMARK_BASE_RUN_ATTEMPT: ${{ steps.baseline.outputs.run_attempt }}
        with:
          script: |
            const { readFileSync } = require('fs');
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const body = readFileSync('benchmark-report.md', 'utf8');
            if (body.length > 20000) throw new Error('Benchmark output too large');
            const marker = '<!-- benchmark-pr-quality-report -->';
            if (!body.includes(marker)) throw new Error('Missing report marker');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid PR');
            const run = context.payload.workflow_run;
            // Immediately before the write, confirm that neither the PR head
            // nor the source CI run has been superseded, including reruns.
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (!policy.matchesRunToPr(run, current)) {
              core.warning('PR head changed or PR closed; skipping stale report.');
              return;
            }
            if (process.env.BENCHMARK_BASE_SHA &&
                (current.base?.sha !== process.env.BENCHMARK_BASE_SHA ||
                 current.base?.ref !== process.env.BENCHMARK_BASE_REF)) {
              core.warning('PR base commit or branch changed after baseline selection; skipping stale report.');
              return;
            }
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: run.id
            });
            if (currentRun.run_attempt !== run.run_attempt || currentRun.status !== 'completed') {
              core.warning('Source CI run has been rerun; skipping stale report.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id,
              head_sha: run.head_sha, event: 'pull_request', per_page: 100
            });
            // Do not publish a completed attempt if a newer attempt is still
            // queued/in progress. Processing and final publishing use the same
            // freshness guard, including non-completed newer attempts.
            if (!policy.isLatestCompletedRun(run, runs.filter(candidate =>
                  candidate.status === 'completed')) ||
                runs.some(candidate =>
                  candidate.workflow_id === run.workflow_id &&
                  candidate.head_sha === run.head_sha &&
                  candidate.event === 'pull_request' &&
                  (candidate.run_number > run.run_number ||
                    (candidate.run_number === run.run_number &&
                     candidate.run_attempt > run.run_attempt)))) {
              core.warning('A newer CI run exists; skipping stale report.');
              return;
            }
            // A selected base coverage artifact is valid only for the exact
            // successful CI attempt that produced it. Reruns or newer failed
            // pushes at the same base SHA must not publish stale comparisons.
            if (process.env.BENCHMARK_BASE_RUN_ID) {
              const selectedId = Number(process.env.BENCHMARK_BASE_RUN_ID);
              const selectedAttempt = Number(process.env.BENCHMARK_BASE_RUN_ATTEMPT);
              if (!Number.isSafeInteger(selectedId) || selectedId <= 0 ||
                  !Number.isSafeInteger(selectedAttempt) || selectedAttempt <= 0) {
                core.warning('Invalid selected baseline CI run; skipping stale report.');
                return;
              }
              const { data: selectedRun } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: selectedId
              });
              if (selectedRun.run_attempt !== selectedAttempt ||
                  selectedRun.status !== 'completed' ||
                  selectedRun.conclusion !== 'success' ||
                  selectedRun.event !== 'push' ||
                  selectedRun.workflow_id !== run.workflow_id ||
                  selectedRun.repository?.id !== current.base?.repo?.id ||
                  selectedRun.head_sha !== current.base?.sha ||
                  selectedRun.head_branch !== current.base?.ref) {
                core.warning('Selected base CI run is no longer valid; skipping stale report.');
                return;
              }
              const baseRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: run.workflow_id,
                branch: current.base.ref, head_sha: current.base.sha,
                event: 'push', status: 'completed', per_page: 100
              });
              const matching = baseRuns.filter(candidate =>
                candidate.repository?.id === current.base.repo.id &&
                candidate.workflow_id === run.workflow_id &&
                candidate.head_sha === current.base.sha &&
                candidate.head_branch === current.base.ref &&
                candidate.event === 'push' &&
                candidate.status === 'completed' &&
                Number.isSafeInteger(candidate.run_number) &&
                Number.isSafeInteger(candidate.run_attempt)
              ).sort((a, b) => b.run_number - a.run_number ||
                b.run_attempt - a.run_attempt);
              const latest = matching[0];
              if (!latest || latest.id !== selectedId ||
                  latest.run_attempt !== selectedAttempt ||
                  latest.conclusion !== 'success') {
                core.warning('A newer base CI result exists; skipping stale report.');
                return;
              }
            }
            // This read/modify/write is serialized by workflow concurrency.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = policy.findOwnedReportComment(comments, marker);
            const ready = body.replace(marker,
              marker + '\n<!-- benchmark-head-sha:' + current.head.sha + ' -->\n<!-- benchmark-ci-run:' + run.id + ':' + run.run_attempt + ' -->\n<!-- benchmark-state:ready -->');
            if (ready.length > 20000) throw new Error('Benchmark report with metadata is too large');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: ready });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: ready });
            }
      - name: Replace stuck processing status on failure
        if: ${{ failure() && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid PR number');
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (current.base?.repo?.full_name !== owner + '/' + repo ||
                !policy.matchesRunToPr(run, current)) {
              core.warning('PR is closed, retargeted, or changed; status not published.');
              return;
            }
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
            if (liveRun.id !== run.id || liveRun.run_attempt !== run.run_attempt ||
                liveRun.status !== 'completed' || liveRun.head_sha !== run.head_sha) {
              core.warning('Source CI was superseded or restarted; status not published.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha,
              event: 'pull_request', per_page: 100
            });
            if (!policy.isLatestCompletedRun(run, runs.filter(r => r.status === 'completed')) ||
                runs.some(r => r.workflow_id === run.workflow_id && r.head_sha === run.head_sha &&
                  r.event === 'pull_request' &&
                  (r.run_number > run.run_number ||
                    (r.run_number === run.run_number && r.run_attempt > run.run_attempt)))) {
              core.warning('A newer CI run exists; status not published.');
              return;
            }
            const marker = '<!-- benchmark-pr-quality-report -->';
            const metadata = '<!-- benchmark-head-sha:' + current.head.sha + ' -->';
            const runMarker = '<!-- benchmark-ci-run:' + run.id + ':' + run.run_attempt + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = policy.findOwnedReportComment(comments, marker);
            const body = [marker, metadata, runMarker, '<!-- benchmark-state:error -->',
              '## Benchmark · Report unavailable',
              '⚠️ **Benchmark could not finish processing this CI run.**',
              'Check the reporting workflow logs. The next CI run will retry on this same comment.',
              '[View reporting workflow](https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + ')'
            ].join('\n\n');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Reconcile skipped or interrupted processing status
        if: ${{ always() && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        env:
          BENCHMARK_PR_NUMBER: ${{ steps.pr.outputs.number }}
          BENCHMARK_BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
          BENCHMARK_BASE_REF: ${{ steps.baseline.outputs.base_ref }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const policy = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/benchmark/src/publish-policy.mjs'
            ).href);
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const issue_number = Number(process.env.BENCHMARK_PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) throw new Error('Invalid PR number');
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            // Do not touch a different/closed PR, a new head or a different fork.
            if (current.base?.repo?.full_name !== owner + '/' + repo ||
                !policy.matchesRunToPr(run, current)) {
              core.notice('PR changed or closed; leaving any newer status untouched.');
              return;
            }
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: run.id
            });
            if (liveRun.id !== run.id || liveRun.workflow_id !== run.workflow_id ||
                liveRun.event !== 'pull_request' || liveRun.head_sha !== run.head_sha ||
                liveRun.head_branch !== run.head_branch) {
              core.warning('CI run identity changed; cannot reconcile comment.');
              return;
            }
            const marker = '<!-- benchmark-pr-quality-report -->';
            const headMarker = '<!-- benchmark-head-sha:' + current.head.sha + ' -->';
            const runMarker = '<!-- benchmark-ci-run:' + run.id + ':' + run.run_attempt + ' -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = policy.findOwnedReportComment(comments, marker);
            // Only the processing state written by THIS run is eligible. A newer
            // run's state, a newly opened head, or a finished report must never be reset.
            if (!previous || !previous.body.includes(headMarker) ||
                !previous.body.includes(runMarker) ||
                !previous.body.includes('<!-- benchmark-state:processing -->')) {
              core.notice('No unfinished processing comment belonging to this CI attempt.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id,
              head_sha: run.head_sha, event: 'pull_request', per_page: 100
            });
            const newer = runs.some(candidate =>
              candidate.workflow_id === run.workflow_id &&
              candidate.head_sha === run.head_sha &&
              candidate.event === 'pull_request' &&
              (candidate.run_number > run.run_number ||
                (candidate.run_number === run.run_number &&
                  candidate.run_attempt > run.run_attempt))
            );
            const baseChanged = Boolean(process.env.BENCHMARK_BASE_SHA && (
              current.base?.sha !== process.env.BENCHMARK_BASE_SHA ||
              current.base?.ref !== process.env.BENCHMARK_BASE_REF
            ));
            const explanation = baseChanged
              ? 'The PR base changed while this report was being prepared. Rerun CI against the current base to get a valid comparison.'
              : newer
                ? 'This CI result was superseded by a newer attempt. Benchmark will publish the newer result after its CI finishes.'
                : 'This CI attempt ended without a publishable report. Check the workflow logs, then rerun CI to retry.';
            const body = [
              marker, headMarker, runMarker, '<!-- benchmark-state:unavailable -->',
              '## Benchmark · Report not published',
              '⚠️ **The previous processing step has finished without a current report.**',
              explanation,
              '[View CI run](https://github.com/' + owner + '/' + repo + '/actions/runs/' + run.id + ')'
            ].join('\n\n');
            await github.rest.issues.updateComment({
              owner, repo, comment_id: previous.id, body
            });
